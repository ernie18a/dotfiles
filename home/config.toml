sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[features]
apps = false
plugins = false
remote_plugin = false
recommended_plugins = false

[skills.bundled]
enabled = false

[tui]
session_picker_view = "dense"
fullscreen_transcript = false
alternate_screen = "never"

[notice]
hide_rate_limit_model_nudge = true

[mcp_servers.op]
url = "http://127.0.0.1:8766/op"

[mcp_servers.sp]
url = "http://127.0.0.1:8766/sp"

[mcp_servers.gpt]
url = "http://127.0.0.1:8766/gpt"
