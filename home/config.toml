[sandbox_workspace_write]
network_access = true

[features]
apps = false
plugins = false
remote_plugin = false
recommended_plugins = false

[skills.bundled]
enabled = false

[mcp_servers.operator2]
command = "/usr/bin/bash"
args = ["/g/app/mcp.chrome/operator2.sh"]
enabled = false

[mcp_servers.debug]
command = "/usr/bin/bash"
args = ["/g/app/mcp.chrome/debug.sh"]
