approval_policy = "never"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[features]
apps = false
plugins = false
remote_plugin = false
recommended_plugins = false

[skills.bundled]
enabled = false

[mcp_servers.operator2]
command = "/usr/bin/bash"
args = ["/g/app/mcp.chrome/operator2.sh"]
enabled = false

[mcp_servers.debug]
command = "/usr/bin/bash"
args = ["/g/app/mcp.chrome/debug.sh"]
enabled = false

[tui]
session_picker_view = "dense"

[notice]
hide_rate_limit_model_nudge = true
